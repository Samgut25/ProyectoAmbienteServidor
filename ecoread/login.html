<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | EcoRead</title>
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <!-- Encabezado -->
    <header class="encabezado">
        <!-- TODO: cambiar a index.html cuando exista la página de inicio -->
        <a class="marca" href="login.html">
            <img src="img/logo.svg" alt="" width="36" height="36">
            <span>EcoRead</span>
        </a>
        <nav aria-label="Menú principal">
            <ul>
                <li><a href="login.html" aria-current="page">Iniciar sesión</a></li>
                <li><a href="registro.html">Crear cuenta</a></li>
                <li><a href="perfil.html">Mi perfil</a></li>
            </ul>
        </nav>
    </header>

    <main class="pagina pagina-login">
        <h1>Inicia sesión</h1>
        <p class="intro">Entra para ver tus publicaciones y las solicitudes de intercambio.</p>

        <section class="bloque">
            <form id="formLogin" action="php/login.php" method="POST" onsubmit="return validarLogin()" novalidate>
                <div class="campo">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" placeholder="nombre@universidad.ac.cr"
                        autocomplete="email" aria-describedby="error-correo">
                    <small class="error" id="error-correo" aria-live="polite"></small>
                </div>

                <div class="campo">
                    <label for="clave">Contraseña</label>
                    <input type="password" id="clave" name="clave" autocomplete="current-password"
                        aria-describedby="error-clave">
                    <small class="error" id="error-clave" aria-live="polite"></small>
                </div>

                <div class="campo campo-opcion">
                    <label class="opcion" for="ver-claves">
                        <input type="checkbox" id="ver-claves" onchange="alternarClaves(this, ['clave'])">
                        Mostrar contraseña
                    </label>
                </div>

                <div class="acciones">
                    <button type="submit" class="boton">Iniciar sesión</button>
                </div>

                <p class="mensaje" id="mensaje-login" aria-live="polite"></p>
            </form>
        </section>

        <p class="cambio">¿Aún no tienes cuenta? <a href="registro.html">Crea una</a></p>
    </main>

    <!-- Pie de página -->
    <footer class="pie">
        <p>&copy; 2026 EcoRead. Proyecto de Ambiente Web Cliente/Servidor, Universidad Fidélitas.</p>
    </footer>

    <script src="js/auth.js"></script>
</body>

</html>
